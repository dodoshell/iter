services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iter
      POSTGRES_USER: iter
      POSTGRES_PASSWORD: iter
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iter -d iter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: iter
      DB_USER: iter
      DB_PASSWORD: iter
      JWT_SECRET: dev-only-secret-change-me-dev-only-secret-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
